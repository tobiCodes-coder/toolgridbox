<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Color Accessibility Studio | WCAG Contrast Checker & Color Palette Tool</title>
  <meta name="description" content="Check color accessibility, analyze contrast ratios, simulate color blindness, generate CSS variables, and build accessible UI color systems instantly." />
  <link rel="stylesheet" href="/src/css/main.css" />
  <link rel="stylesheet" href="./color-accessibility.css" />
</head>
<body>
  <main class="tool-container">
    <h1>Color accessibility studio</h1>
    <p>Check contrast, preview UI, and simulate color blindness.</p>

    <div class="studio-layout">
      <div class="controls-panel">
        <label class="color-field">
          Text color
          <input type="color" id="textColor" value="#1a1a1a" />
        </label>
        <label class="color-field">
          Background color
          <input type="color" id="bgColor" value="#ffffff" />
        </label>
        <label class="color-field">
          Primary color
          <input type="color" id="primaryColor" value="#185fa5" />
        </label>
        <label class="color-field">
          Secondary color
          <input type="color" id="secondaryColor" value="#e0e0e0" />
        </label>

        <div class="hex-inputs">
          <label>Text HEX <input type="text" id="textHex" value="#1a1a1a" /></label>
          <label>Background HEX <input type="text" id="bgHex" value="#ffffff" /></label>
        </div>

        <div class="contrast-result" id="contrastResult"></div>

        <div class="colorblind-select">
          <label for="cbSelect">Color blindness simulation</label>
          <select id="cbSelect">
            <option value="none">None</option>
            <option value="protanopia">Protanopia</option>
            <option value="deuteranopia">Deuteranopia</option>
            <option value="tritanopia">Tritanopia</option>
          </select>
        </div>

        <div class="action-row">
          <button id="copyCssBtn">Copy CSS variables</button>
          <button id="copyHexBtn" class="secondary">Copy HEX palette</button>
        </div>

        <p id="statusMsg" class="status-msg"></p>
      </div>

      <div class="preview-panel">
        <div id="previewArea" class="preview-area">
          <h2 class="preview-heading">Heading example</h2>
          <p class="preview-paragraph">This is a paragraph showing how your text color reads against the background you picked.</p>
          <div class="preview-row">
            <button class="preview-btn">Primary button</button>
            <span class="preview-badge">Badge</span>
          </div>
          <div class="preview-alert">This is an alert message using your color combination.</div>
          <input type="text" class="preview-input" placeholder="Input field example" />
          <a href="#" class="preview-link" onclick="return false;">This is a link example</a>
        </div>

        <pre id="cssOutput" class="css-output"></pre>
      </div>
    </div>

    <svg style="position:absolute; width:0; height:0;">
      <defs>
        <filter id="protanopia">
          <feColorMatrix type="matrix" values="0.567,0.433,0,0,0  0.558,0.442,0,0,0  0,0.242,0.758,0,0  0,0,0,1,0" />
        </filter>
        <filter id="deuteranopia">
          <feColorMatrix type="matrix" values="0.625,0.375,0,0,0  0.7,0.3,0,0,0  0,0.3,0.7,0,0  0,0,0,1,0" />
        </filter>
        <filter id="tritanopia">
          <feColorMatrix type="matrix" values="0.95,0.05,0,0,0  0,0.433,0.567,0,0  0,0.475,0.525,0,0  0,0,0,1,0" />
        </filter>
      </defs>
    </svg>
  </main>

  <script type="module" src="./color-accessibility.js"></script>
</body>
</html>
