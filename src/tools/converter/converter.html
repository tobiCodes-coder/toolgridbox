<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Encode, Decode & Hash Tool — Free Online Converter | ToolGrid</title>
  <meta name="description" content="Base64 encode/decode, URL encode/decode, and generate MD5/SHA hashes online. Free, fast, no signup required." />
  <link rel="stylesheet" href="/src/css/main.css" />
  <link rel="stylesheet" href="./converter.css" />
</head>
<body>

  <a href="/index.html" class="back-home">← Back to ToolGrid</a>

  <main class="tool-container">
    <h1>Encode, decode & hash</h1>
    <p>Convert text between formats, right in your browser.</p>

    <details class="how-to-use">
  <summary>How to use this tool</summary>
  <div class="how-to-use-content">
    Switch between Base64, URL, and Hash tabs. Enter your text and click Encode, Decode, or Generate.
  </div>
</details>

    <div class="tabs">
      <button class="tab-btn active" data-tab="base64">Base64</button>
      <button class="tab-btn" data-tab="url">URL</button>
      <button class="tab-btn" data-tab="hash">Hash</button>
    </div>

    <div id="base64Tab" class="tab-panel active">
      <textarea id="base64Input" placeholder="Enter text or Base64..."></textarea>
      <div class="action-row">
        <button id="base64EncodeBtn">Encode</button>
        <button id="base64DecodeBtn" class="secondary">Decode</button>
        <button id="base64CopyBtn" class="secondary">Copy result</button>
      </div>
      <pre id="base64Output" class="output-box"></pre>
    </div>

    <div id="urlTab" class="tab-panel">
      <textarea id="urlInput" placeholder="Enter text or URL..."></textarea>
      <div class="action-row">
        <button id="urlEncodeBtn">Encode</button>
        <button id="urlDecodeBtn" class="secondary">Decode</button>
        <button id="urlCopyBtn" class="secondary">Copy result</button>
      </div>
      <pre id="urlOutput" class="output-box"></pre>
    </div>

    <div id="hashTab" class="tab-panel">
      <textarea id="hashInput" placeholder="Enter text to hash..."></textarea>
      <div class="action-row">
        <label class="algo-label">
          Algorithm
          <select id="hashAlgo">
            <option value="SHA-1">SHA-1</option>
            <option value="SHA-256" selected>SHA-256</option>
            <option value="SHA-384">SHA-384</option>
            <option value="SHA-512">SHA-512</option>
          </select>
        </label>
        <button id="hashGenerateBtn">Generate</button>
        <button id="hashCopyBtn" class="secondary">Copy result</button>
      </div>
      <pre id="hashOutput" class="output-box"></pre>
    </div>

    <p id="statusMsg" class="status-msg"></p>
  </main>

  <script type="module" src="./converter.js"></script>
</body>
</html>
