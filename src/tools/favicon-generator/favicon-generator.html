<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Favicon Generator | Create Website Icons</title>
  <meta name="description" content="Generate favicons in multiple sizes (16x16, 32x32, 64x64, 128x128). Free, fast, works in your browser." />
  <link rel="stylesheet" href="/src/css/main.css" />
  <link rel="stylesheet" href="./favicon-generator.css" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://toolgridbox.pages.dev/src/tools/favicon-generator/favicon-generator.html" />
  <meta property="og:title" content="Free Favicon Generator | Create Website Icons" />
  <meta property="og:description" content="Generate favicons in multiple sizes. Free, fast, works in your browser." />
  <meta property="og:image" content="https://toolgridbox.pages.dev/assets/og-image.png" />
  <meta property="twitter:card" content="summary_large_image" />
  <link rel="canonical" href="https://toolgridbox.pages.dev/src/tools/favicon-generator/favicon-generator.html" />
</head>
<body>
  <a href="/index.html" class="back-home">← Back to ToolGrid</a>
  <main class="tool-container">
    <header class="tool-hero">
      <div class="tool-icon">FAV</div>
      <h1>Favicon generator</h1>
      <p>Generate favicons in multiple sizes for your website.</p>
    </header>
    <details class="how-to-use"><summary>How to use this tool</summary><div class="how-to-use-content">Upload an image (ideally 512x512 or larger), download the favicon package.</div></details>
    <div id="dropZone" class="drop-zone">
      <div class="drop-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>
      <p class="drop-title">Upload your logo</p>
      <span class="drop-hint">PNG, JPG, SVG — best at 512x512 or larger</span>
      <input type="file" id="fileInput" accept="image/*" hidden />
    </div>
    <div id="resultArea" style="display:none;margin-top:24px;">
      <div class="preview-grid"><div class="fav-preview" data-size="16">16x16</div><div class="fav-preview" data-size="32">32x32</div><div class="fav-preview" data-size="64">64x64</div><div class="fav-preview" data-size="128">128x128</div><div class="fav-preview" data-size="256">256x256</div></div>
      <div class="action-row"><button id="downloadBtn">Download All (.zip)</button><button id="resetBtn" class="secondary">Choose another image</button></div>
    </div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script type="module" src="./favicon-generator.js"></script>
  <script type="module" src="/src/js/back-nav.js"></script>
</body>
</html>
