<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Create linear and radial CSS gradients visually. Add color stops, adjust angle, and copy the generated CSS instantly. Free, no signup." />
  <link rel="stylesheet" href="/src/css/main.css" />
  <link rel="stylesheet" href="./gradient-generator.css" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://toolgridbox.pages.dev/src/tools/gradient-generator/gradient-generator.html" />
  <meta property="og:title" content="CSS Gradient Generator — Free Online Tool | ToolGrid" />
  <meta property="og:description" content="Create linear and radial CSS gradients visually. Add color stops, adjust angle, and copy the generated CSS instantly. Free, no signup." />
  <meta property="og:image" content="https://toolgridbox.pages.dev/assets/og-image.png" />
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:title" content="CSS Gradient Generator — Free Online Tool | ToolGrid" />

<body>

  <a href="/index.html" class="back-home">← Back to ToolGrid</a>

  <main class="tool-container">
    <h1>CSS gradient generator</h1>
    <p>Build a gradient visually and copy the CSS.</p>

    <details class="how-to-use">
  <summary>How to use this tool</summary>
  <div class="how-to-use-content">
    Add color stops, adjust their position and color, choose linear or radial, then copy the generated CSS.
  </div>
</details>

    <div id="preview" class="preview-box"></div>

    <div class="options-row">
      <label class="option">
        Type
        <select id="typeSelect">
          <option value="linear">Linear</option>
          <option value="radial">Radial</option>
        </select>
      </label>

      <label class="option" id="angleOption">
        Angle: <span id="angleValue">90</span>&deg;
        <input type="range" id="angleRange" min="0" max="360" value="90" />
      </label>
    </div>

    <div id="stopsList" class="stops-list"></div>

    <button id="addStopBtn" class="link-btn">+ Add color stop</button>

    <div class="action-row">
      <button id="copyBtn">Copy CSS</button>
    </div>

    <pre id="cssOutput" class="css-output"></pre>

    <p id="statusMsg" class="status-msg"></p>
  </main>

  <script type="module" src="./gradient-generator.js"></script>
  <script type="module" src="/src/js/back-nav.js"></script>
</body>
</html>
