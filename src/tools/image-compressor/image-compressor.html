<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Compressor — Free Online Tool | ToolGrid</title>
  <meta name="description" content="Compress and resize images online in your browser. Adjust quality, convert format, and download instantly. Free, no signup, no upload to a server." />
  <link rel="stylesheet" href="/src/css/main.css" />
  <link rel="stylesheet" href="./image-compressor.css" />
</head>
<body>

  <a href="/index.html" class="back-home">← Back to ToolGrid</a>

  <main class="tool-container">
    <h1>Image compressor</h1>
    <p>Compress and resize images right in your browser. Nothing is uploaded anywhere.</p>

    <div id="dropZone" class="drop-zone">
      <p>Drag & drop an image here, or click to select</p>
      <input type="file" id="fileInput" accept="image/*" hidden />
    </div>

    <div id="editorArea" class="editor-area" style="display:none;">

      <div class="options-row">
        <div class="option">
          <label for="qualityRange">Quality: <span id="qualityValue">80</span>%</label>
          <input type="range" id="qualityRange" min="10" max="100" value="80" />
        </div>

        <div class="option">
          <label for="widthInput">Max width (px)</label>
          <input type="number" id="widthInput" placeholder="Original" />
        </div>

        <div class="option">
          <label for="formatSelect">Format</label>
          <select id="formatSelect">
            <option value="image/jpeg">JPEG</option>
            <option value="image/webp">WebP</option>
            <option value="image/png">PNG</option>
          </select>
        </div>
      </div>

      <div class="compare-row">
        <div class="compare-box">
          <p class="compare-label">Original</p>
          <img id="originalPreview" />
          <p id="originalSize" class="size-label"></p>
        </div>
        <div class="compare-box">
          <p class="compare-label">Compressed</p>
          <img id="compressedPreview" />
          <p id="compressedSize" class="size-label"></p>
        </div>
      </div>

      <div class="action-row">
        <button id="downloadBtn">Download compressed image</button>
        <button id="resetBtn" class="secondary">Choose another image</button>
      </div>

      <p id="statusMsg" class="status-msg"></p>
    </div>
  </main>

  <script type="module" src="./image-compressor.js"></script>
</body>
</html>
