<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Image Cropper | Crop Images Online</title>
  <meta name="description" content="Crop images to any size or aspect ratio. Free, fast, works in your browser." />
  <link rel="stylesheet" href="/src/css/main.css" />
  <link rel="stylesheet" href="./image-cropper.css" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://toolgridbox.pages.dev/src/tools/image-cropper/image-cropper.html" />
  <meta property="og:title" content="Free Image Cropper | Crop Images Online" />
  <meta property="og:description" content="Crop images to any size or aspect ratio. Free, fast, works in your browser." />
  <meta property="og:image" content="https://toolgridbox.pages.dev/assets/og-image.png" />
  <meta property="twitter:card" content="summary_large_image" />
  <link rel="canonical" href="https://toolgridbox.pages.dev/src/tools/image-cropper/image-cropper.html" />
</head>
<body>
  <a href="/index.html" class="back-home">← Back to ToolGrid</a>
  <main class="tool-container">
    <header class="tool-hero">
      <div class="tool-icon">CROP</div>
      <h1>Image cropper</h1>
      <p>Crop images to any size or aspect ratio. Works in your browser.</p>
    </header>
    <details class="how-to-use"><summary>How to use this tool</summary><div class="how-to-use-content">Upload an image, drag the crop area, adjust aspect ratio if needed, then download.</div></details>
    <div id="dropZone" class="drop-zone">
      <div class="drop-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg></div>
      <p class="drop-title">Drag & drop an image</p>
      <span class="drop-hint">JPG, PNG, WebP supported</span>
      <input type="file" id="fileInput" accept="image/*" hidden />
    </div>
    <div id="editorArea" class="editor-area" style="display:none;">
      <div class="crop-container"><canvas id="cropCanvas"></canvas></div>
      <div class="options-row"><label class="option">Aspect Ratio<select id="aspectSelect"><option value="free">Free</option><option value="1:1">1:1 Square</option><option value="16:9">16:9</option><option value="4:3">4:3</option></select></label></div>
      <div class="action-row"><button id="cropBtn">Crop & Download</button><button id="resetBtn" class="secondary">Choose another image</button></div>
    </div>
  </main>
  <script type="module" src="./image-cropper.js"></script>
  <script type="module" src="/src/js/back-nav.js"></script>
</body>
</html>
