<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image to Base64 Converter | Free Online Tool</title>
  <meta name="description" content="Convert images to Base64 encoded strings. Free, fast, works in your browser." />
  <link rel="stylesheet" href="/src/css/main.css" />
  <link rel="stylesheet" href="./image-to-base64.css" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://toolgridbox.pages.dev/src/tools/image-to-base64/image-to-base64.html" />
  <meta property="og:title" content="Image to Base64 Converter | Free Online Tool" />
  <meta property="og:description" content="Convert images to Base64 encoded strings. Free, fast, works in your browser." />
  <meta property="og:image" content="https://toolgridbox.pages.dev/assets/og-image.png" />
  <meta property="twitter:card" content="summary_large_image" />
  <link rel="canonical" href="https://toolgridbox.pages.dev/src/tools/image-to-base64/image-to-base64.html" />
</head>
<body>
  <a href="/index.html" class="back-home">← Back to ToolGrid</a>
  <main class="tool-container">
    <header class="tool-hero">
      <div class="tool-icon">B64</div>
      <h1>Image to Base64</h1>
      <p>Convert images to Base64 encoded strings for embedding in HTML/CSS.</p>
    </header>
    <details class="how-to-use"><summary>How to use this tool</summary><div class="how-to-use-content">Upload an image, get the Base64 string, copy it to your code.</div></details>
    <div id="dropZone" class="drop-zone">
      <div class="drop-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></div>
      <p class="drop-title">Drag & drop an image</p>
      <span class="drop-hint">JPG, PNG, WebP, SVG supported</span>
      <input type="file" id="fileInput" accept="image/*" hidden />
    </div>
    <div id="resultArea" style="display:none;margin-top:24px;">
      <div class="preview-box"><img id="previewImg" /></div>
      <textarea id="base64Output" readonly rows="8"></textarea>
      <div class="action-row"><button id="copyBtn">Copy to Clipboard</button><button id="resetBtn" class="secondary">Choose another image</button></div>
      <p id="statusMsg" class="status-msg"></p>
    </div>
  </main>
  <script type="module" src="./image-to-base64.js"></script>
  <script type="module" src="/src/js/back-nav.js"></script>
</body>
</html>
