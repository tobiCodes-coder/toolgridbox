<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Images to PDF Converter | JPG & PNG to PDF Online</title>
  <meta name="description" content="Convert JPG or PNG images into a single PDF file directly in your browser. Reorder pages, choose page size, and download instantly. Free and private." />
  <link rel="stylesheet" href="/src/css/main.css" />
  <link rel="stylesheet" href="./images-to-pdf.css" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://toolgridbox.pages.dev/src/tools/images-to-pdf/images-to-pdf.html" />
  <meta property="og:title" content="Free Images to PDF Converter | JPG &amp; PNG to PDF Online" />
  <meta property="og:description" content="Convert JPG or PNG images into a single PDF file directly in your browser. Reorder pages, choose page size, and download instantly. Free and private." />
  <meta property="og:image" content="https://toolgridbox.pages.dev/assets/og-image.png" />
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:title" content="Free Images to PDF Converter | JPG &amp; PNG to PDF Online" />
  <meta property="twitter:description" content="Convert JPG or PNG images into a single PDF file directly in your browser. Reorder pages, choose page size, and download instantly. Free and private." />
  <link rel="canonical" href="https://toolgridbox.pages.dev/src/tools/images-to-pdf/images-to-pdf.html" />
</head>
<body>
  <a href="/index.html" class="back-home">← Back to ToolGrid</a>

  <main class="tool-container">
    <h1>Images to PDF</h1>
    <p>Combine JPG or PNG images into a single PDF file.</p>

    <details class="how-to-use">
      <summary>How to use this tool</summary>
      <div class="how-to-use-content">
        Upload one or more images. Drag to reorder them, choose a page size, then click Convert to PDF and download the result.
      </div>
    </details>

    <div id="dropZone" class="drop-zone">
      <p>Drag & drop images here, or click to select</p>
      <input type="file" id="fileInput" accept="image/jpeg,image/png" multiple hidden />
    </div>

    <div id="editorArea" class="editor-area" style="display:none;">
      <div id="imageList" class="image-list"></div>

      <div class="options-row">
        <label class="option">
          Page size
          <select id="pageSizeSelect">
            <option value="fit">Fit to image</option>
            <option value="a4">A4</option>
          </select>
        </label>
      </div>

      <div class="action-row">
        <button id="convertBtn">Convert to PDF</button>
        <button id="resetBtn" class="secondary">Start over</button>
      </div>

      <p id="statusMsg" class="status-msg"></p>

      <div id="downloadArea" class="download-area" style="display:none;">
        <button id="downloadBtn">Download PDF</button>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script type="module" src="./images-to-pdf.js"></script>
  <script type="module" src="/src/js/back-nav.js"></script>
</body>
</html>
