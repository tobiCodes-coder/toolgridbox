<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Meme Generator | Create Memes Online</title>
  <meta name="description" content="Create memes with custom text, fonts, and colors. Free, fast, works in your browser." />
  <link rel="stylesheet" href="/src/css/main.css" />
  <link rel="stylesheet" href="./meme-generator.css" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://toolgridbox.pages.dev/src/tools/meme-generator/meme-generator.html" />
  <meta property="og:title" content="Free Meme Generator | Create Memes Online" />
  <meta property="og:description" content="Create memes with custom text, fonts, and colors. Free, fast, works in your browser." />
  <meta property="og:image" content="https://toolgridbox.pages.dev/assets/og-image.png" />
  <meta property="twitter:card" content="summary_large_image" />
  <link rel="canonical" href="https://toolgridbox.pages.dev/src/tools/meme-generator/meme-generator.html" />
</head>
<body>
  <a href="/index.html" class="back-home">← Back to ToolGrid</a>
  <main class="tool-container">
    <header class="tool-hero">
      <div class="tool-icon">MEME</div>
      <h1>Meme generator</h1>
      <p>Create memes with custom text. Works in your browser.</p>
    </header>
    <details class="how-to-use"><summary>How to use this tool</summary><div class="how-to-use-content">Upload an image, add top and bottom text, customize colors, then download.</div></details>
    <div id="dropZone" class="drop-zone">
      <div class="drop-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>
      <p class="drop-title">Upload your meme template</p>
      <span class="drop-hint">JPG, PNG, WebP supported</span>
      <input type="file" id="fileInput" accept="image/*" hidden />
    </div>
    <div id="editorArea" style="display:none;margin-top:24px;">
      <canvas id="memeCanvas"></canvas>
      <div class="options-row">
        <div class="option"><label>Top Text</label><input type="text" id="topText" placeholder="Top text" /></div>
        <div class="option"><label>Bottom Text</label><input type="text" id="bottomText" placeholder="Bottom text" /></div>
      </div>
      <div class="color-row">
        <label>Text Color<input type="color" id="textColor" value="#ffffff" /></label>
        <label>Stroke Color<input type="color" id="strokeColor" value="#000000" /></label>
      </div>
      <div class="action-row"><button id="downloadBtn">Download Meme</button><button id="resetBtn" class="secondary">Choose another image</button></div>
    </div>
  </main>
  <script type="module" src="./meme-generator.js"></script>
  <script type="module" src="/src/js/back-nav.js"></script>
</body>
</html>
