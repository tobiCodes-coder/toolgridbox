<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Generator — Free Online Tool | ToolGrid</title>
  <meta name="description" content="Generate QR codes instantly from any text or URL. Customize size, color, and download as PNG. Free, fast, no signup required." />
  <link rel="stylesheet" href="/src/css/main.css" />
  <link rel="stylesheet" href="./qr-generator.css" />
</head>
<body>
  <div id="app"></div>

  <main class="tool-container">
    <h1>QR code generator</h1>
    <p>Enter text or a URL to generate a QR code instantly.</p>

    <input type="text" id="qrInput" placeholder="Enter text or URL..." />

    <div class="options-row">
      <div class="option">
        <label for="sizeSelect">Size</label>
        <select id="sizeSelect">
          <option value="150">150px</option>
          <option value="200" selected>200px</option>
          <option value="300">300px</option>
          <option value="400">400px</option>
        </select>
      </div>

      <div class="option">
        <label for="levelSelect">Error correction</label>
        <select id="levelSelect">
          <option value="L">Low</option>
          <option value="M" selected>Medium</option>
          <option value="Q">Quartile</option>
          <option value="H">High</option>
        </select>
      </div>

      <div class="option">
        <label for="fgColor">QR color</label>
        <input type="color" id="fgColor" value="#000000" />
      </div>

      <div class="option">
        <label for="bgColor">Background</label>
        <input type="color" id="bgColor" value="#ffffff" />
      </div>
    </div>

    <div id="qrResult" class="qr-result"></div>

    <div class="action-row">
      <button id="downloadBtn" style="display:none;">Download PNG</button>
      <button id="copyBtn" style="display:none;">Copy image</button>
    </div>

    <p id="statusMsg" class="status-msg"></p>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script type="module" src="./qr-generator.js"></script>
</body>
</html>
