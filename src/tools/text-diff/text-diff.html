<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Diff Checker — Compare Text Online | ToolGrid</title>
  <meta name="description" content="Compare two texts word by word, character by character, or line by line. See additions and deletions highlighted instantly. Free, no signup." />
  <link rel="stylesheet" href="/src/css/main.css" />
  <link rel="stylesheet" href="./text-diff.css" />
</head>
<body>

  <a href="/index.html" class="back-home">← Back to ToolGrid</a>
  
  <main class="tool-container">
    <h1>Text diff checker</h1>
    <p>Paste two texts below to see what changed.</p>

    <div class="diff-inputs">
      <div class="input-col">
        <div class="col-header">
          <span>Original</span>
          <button id="sampleBtn" class="link-btn">Load sample</button>
        </div>
        <textarea id="text1" placeholder="Original text..."></textarea>
      </div>
      <div class="input-col">
        <div class="col-header">
          <span>Changed</span>
          <button id="clearBtn" class="link-btn">Clear both</button>
        </div>
        <textarea id="text2" placeholder="Changed text..."></textarea>
      </div>
    </div>

    <div class="action-row">
      <button id="compareBtn">Compare</button>

      <label class="mode-label">
        Compare by
        <select id="modeSelect">
          <option value="word">Word</option>
          <option value="char">Character</option>
          <option value="line">Line</option>
        </select>
      </label>

      <button id="copyBtn" class="secondary" style="display:none;">Copy result</button>
    </div>

    <div id="statsRow" class="stats-row" style="display:none;">
      <span class="stat added">+<span id="addedCount">0</span> added</span>
      <span class="stat removed">-<span id="removedCount">0</span> removed</span>
    </div>

    <div id="result" class="diff-result"></div>
  </main>

  <script type="module" src="./text-diff.js"></script>
</body>
</html>
